# Publicação automática: a cada alteração na branch "main", o app é
# compilado e publicado no Firebase Hosting (https://encomendas-apmg.web.app).
# Só roda depois que os segredos estiverem configurados (veja o README).
name: Publicar app

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ vars.PUBLICAR_ATIVO == 'sim' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: encomendas-apmg.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: encomendas-apmg
          VITE_FIREBASE_STORAGE_BUCKET: encomendas-apmg.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: encomendas-apmg
          channelId: live
