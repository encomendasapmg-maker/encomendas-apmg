# Rotina agendada: envia os avisos ao celular, alerta delivery parado e
# encerra pedidos vencidos. Substitui as funções pagas do Firebase.
#
# Frequência: a cada 5 minutos (o mínimo do GitHub). O repositório é público,
# então os minutos do GitHub Actions são gratuitos e ilimitados. O código não
# tem senhas: as chaves ficam nos "Secrets", que não aparecem para ninguém.
# Atenção: em repositório público, o GitHub desliga rotinas agendadas após
# 60 dias sem nenhuma alteração no repositório; se isso ocorrer, reative em
# Actions › Avisos › "Enable workflow".
name: Avisos

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Fica desligada até a variável AVISOS_ATIVO = sim ser criada (README).
    if: ${{ vars.AVISOS_ATIVO == 'sim' }}
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run avisos
        env:
          FIREBASE_ADMIN_KEY: ${{ secrets.FIREBASE_ADMIN_KEY }}
          URL_APP: ${{ vars.URL_APP }}
